<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#121510"/>
  <circle cx="1000" cy="300" r="230" fill="none" stroke="#293322"/>
  <circle cx="1000" cy="300" r="190" fill="none" stroke="#293322" stroke-dasharray="5 10"/>
  <g font-family="Arial, sans-serif">
    <text x="72" y="90" fill="#c5f66a" font-size="34" font-weight="700">entrenós.</text>
    <text x="72" y="165" fill="#a6b993" font-size="18" letter-spacing="4">JOGO DO IMPOSTOR</text>
    <text x="72" y="263" fill="#f3f3e9" font-size="62" font-weight="700">Você conhece</text>
    <text x="72" y="336" fill="#f3f3e9" font-size="62" font-weight="700">seus amigos.</text>
    <text x="72" y="409" fill="#c5f66a" font-size="34">Mas deveria confiar em todos?</text>
    <rect x="72" y="477" width="270" height="58" rx="15" fill="#c5f66a"/>
    <text x="207" y="514" text-anchor="middle" fill="#17200e" font-size="21" font-weight="700">COMPLETO E GRÁTIS</text>
    <text x="72" y="583" fill="#a7b39a" font-size="18">Um celular. Vários suspeitos. Sem cadastro.</text>
  </g>
  <g transform="translate(810 160) rotate(9 140 150)">
    <rect width="280" height="320" rx="25" fill="#c5f66a"/>
    <path d="M30 115C70 55 210 55 250 115L230 185C190 205 165 180 140 166C115 180 90 205 50 185Z" fill="#17200e"/>
