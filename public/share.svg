    <text x="30" y="252" fill="#17200e" font-family="Arial, sans-serif" font-size="33" font-weight="700">Quem está</text>
    <text x="30" y="292" fill="#17200e" font-family="Arial, sans-serif" font-size="33" font-weight="700">mentindo?</text>
  </g>
